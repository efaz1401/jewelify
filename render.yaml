services:
  - type: web
    name: jewelify
    env: node
    plan: free
    buildCommand: npm run install:all && npm --prefix client run build
    startCommand: npm --prefix server start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      # Public canonical domain (no trailing slash) — used for canonical URLs,
      # Open Graph tags, sitemap.xml and robots.txt
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@jewelify.com
      - key: ADMIN_PASSWORD
        sync: false
